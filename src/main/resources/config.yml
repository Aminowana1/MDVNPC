# Purpur 1.21.6 / Java 21 / LibsDisguises 11.0.18
# Un único reloj compartido; 10 ticks = 2 actualizaciones por segundo a 20 TPS.
update-interval-ticks: 10
# Mirada: se actualiza de forma independiente. 5 = cada 0.25s; 20 = cada 1s.
look-update-interval-ticks: 10
# No consultar jugadores invisibles ni espectadores para mirada/diálogos/clics.
ignore-invisible-players: true
ignore-spectators: true
# Cambio mínimo de ángulo antes de enviar una rotación nueva.
rotation-threshold-degrees: 3.0
# Conserva la excepción de spawn original para NPC propios. false respeta todo bloqueo.
worldguard-spawn-bypass: true
# false respeta cancelaciones de otros plugins. true permite abrir SHOP en lobbies protegidos.
# No se puede saber qué plugin canceló el evento; activar solo si es intencional.
shop-allow-cancelled-interaction: false
# Rutinas opcionales: cada NPC se guarda en NPCs/<id>/routines.yml. No fuerzan chunks.
routines:
  default-speed: 2.4 # bloques/segundo; cada goal puede sustituirlo
  random-radius: 20
  activation-range: 48
  movement-interval-ticks: 2 # 1..4; seguimiento de rutas Paper, IA autónoma apagada
  passive-update-ticks: 8 # 2..20; NPC quietos actualizan menos, horario/presencia siguen vigilados
  path-starts-per-update: 2 # 1..8; máximo compartido de nuevas búsquedas Paper por actualización
  dancing: true # solo NPC con rasgo Fiestero: dejan la silla, bailan junto a músicos y vuelven
  dance-duration-seconds: 60 # tiempo bailando; empieza al llegar a la pista (1..600)
  dance-seated-seconds: 30 # descanso completo desde que vuelve a sentarse (1..600)
  seat-offset-y: 0.5 # altura del asiento respecto del bloque de escalera (-4..4)
  # Nombres nativos de LibsDisguises; los antiguos name-offset-* ya no se aplican.
  seated-consumption: true
  seated-reading: true
  reading-chance: 0.30 # probabilidad de leer en lugar de comer/beber
  reading-min-seconds: 12
  reading-max-seconds: 25
  occasional-looking: true
  glance-min-seconds: 8
  glance-max-seconds: 18

  # Miradas por contexto. Ángulos en grados; probabilidades 0..1.
  looking:
    walking:
      enabled: true
      interval-min-seconds: 8 # espera entre miradas
      interval-max-seconds: 18
      duration-min-seconds: 1.25 # tiempo que mantiene cada mirada
      duration-max-seconds: 3
      chance: 1.0 # probabilidad de mirar cuando vence la espera
      update-interval-ticks: 4 # suavizado; no baja del intervalo global de movimiento
      yaw-min: -35 # giro aleatorio horizontal, negativo=izquierda
      yaw-max: 35
      pitch-min: -10 # vertical, negativo=arriba
      pitch-max: 12
      yaw-limit: 40 # giro máximo respecto del cuerpo
      yaw-step: 12 # grados máximos por actualización
      pitch-step: 7
      reading-pitch: 28 # inclinación al leer; útil en seated
      look-at-players: false
      player-range: 3 # distancia máxima real; 0 desactiva búsqueda
      player-chance: 1.0 # probabilidad de elegir un jugador al mirar
      require-line-of-sight: true
      player-pitch-min: -25
      player-pitch-max: 35
    seated:
      enabled: true
      interval-min-seconds: 8 # espera entre miradas
      interval-max-seconds: 18
      duration-min-seconds: 1.25 # tiempo que mantiene cada mirada
      duration-max-seconds: 3
      chance: 1.0 # probabilidad de mirar cuando vence la espera
      update-interval-ticks: 4 # suavizado; no baja del intervalo global de movimiento
      yaw-min: -35 # giro aleatorio horizontal, negativo=izquierda
      yaw-max: 35
      pitch-min: -10 # vertical, negativo=arriba
      pitch-max: 12
      yaw-limit: 65 # giro máximo respecto del cuerpo
      yaw-step: 12 # grados máximos por actualización
      pitch-step: 7
      reading-pitch: 28 # inclinación al leer; útil en seated
      look-at-players: true
      player-range: 3 # distancia máxima real; 0 desactiva búsqueda
      player-chance: 1.0 # probabilidad de elegir un jugador al mirar
      require-line-of-sight: true
      player-pitch-min: -25
      player-pitch-max: 35
  restless:
    frequency-multiplier: 6 # inquieto: divide la espera entre miradas
    duration-multiplier: 0.5 # miradas más cortas
    angle-multiplier: 1.5 # respeta yaw-limit y los límites verticales
    arms-enabled: true
    arm-min-seconds: 2
    arm-max-seconds: 5
    arm-chance: 0.8 # no gesticula mientras lee, come o bebe
  close-preopened-doors: true # cierra también puertas de madera ya abiertas por las que pasa
  meal-min-seconds: 30
  meal-max-seconds: 90
  beer-type: CONSUMABLE # ID interno de categoría MMOItems, no nombre traducido
  beer-id: CERVEZA
messages:
  prefix: '&8[&2MDVNPC&8] &7'
  no-permission: '&cNo tienes permiso.'
  player-only: '&cEste comando requiere un jugador.'
  reloaded: '&aConfiguración recargada. NPC configurados: &f{count}'
  saved: '&aNPC &f{npc}&a guardado.'
  deleted: '&aNPC &f{npc}&a eliminado.'
  error: '&cNo se pudo completar: &f{error}'
  not-found: '&cNo existe ese NPC.'
  list: '&7NPC: &f{npcs}'
  status: '&7Configurados: &f{count}&7. Activos: &f{active}&7. Intervalo: &f{ticks} ticks&7.'
  cooldown: '&7Espera &e{seconds}s&7 antes de volver a interactuar.'
  shop-empty: '&eEste vendedor todavía no tiene intercambios disponibles.'
  shop-busy: '&cOtro administrador está editando esta tienda.'
  shop-invalid: '&cNo puedes abrir esta tienda ahora.'
  shop-saved: '&aTienda guardada: &f{npc}&a (página &f{page}&a).'
  action-denied: '&cNo tienes permiso para interactuar con este NPC.'
  help:
    - "&e/mdvnpc rasgo <id> [ninguno|alcoholico|lector|gloton|inquieto|ruidoso]"
    - '&e/mdvnpc list &7- Ver los NPC.'
    - '&e/mdvnpc status [id] &7- Ver activos o estado de rutina/música de un NPC.'
    - '&e/mdvnpc create <id> <skin> [normal|shop] [nombre] &7- Crear aquí.'
    - '&e/mdvnpc mode <id> normal|shop &7- Cambiar comportamiento.'
    - '&e/mdvnpc shop <id> &7- Editar trueques del NPC vendedor.'
    - '&e/mdvnpc movehere <id> &7- Mover aquí.'
    - '&e/mdvnpc delete <id> &7- Eliminar.'
    - '&e/mdvnpc rename <id> <nombre> &7- Cambiar nombre.'
    - '&e/mdvnpc skin <id> <jugador> &7- Cambiar skin.'
    - '&e/mdvnpc enable <id> <true|false> &7- Activar/desactivar.'
    - '&e/mdvnpc rutinas <id> &7- Abrir el editor gráfico de rutinas.'
    - '&e/mdvnpc reload &7- Recargar config.yml y la carpeta NPCs.'

# Sonidos locales; una secuencia por NPC, aunque haya varios oyentes.
npc-sounds:
  voice-enabled: true
  voice-volume: 0.3
  noisy-volume: 1.0
  steps-enabled: true
  step-volume: 0.25
  # Secuencia corta de sonidos para simular habla, compartida entre oyentes.
  voice-syllables: 3
  noisy-syllables: 5
  voice-gap-ticks: 5
  pitch-min: 0.8
  pitch-max: 1.3
  noisy-idle-enabled: true
  idle-min-seconds: 40
  idle-max-seconds: 90
  idle-syllables: 8
  idle-gap-ticks: 7
  idle-volume: 1.2
  idle-player-range: 12 # sin jugadores cerca no inicia ruido espontáneo

# Reacción cosmética a un golpe directo de jugador; el NPC sigue siendo invulnerable.
npc-reactions:
  enabled: true
  cooldown-seconds: 5 # por NPC, aunque ataquen varios jugadores
  max-hit-distance: 4.5
  look-seconds: 3
  look-range: 8
  angry-particles: 5 # 0 desactiva
  impact-particles: 7 # 0 desactiva
  hit-volume: 0.6
  lines:
    - '&7{npc} &f» &c¡Eh, no me pegues!'
    - '&7{npc} &f» &c¡Un poco de respeto, {player}!'
    - '&7{npc} &f» &c¡Estate quieto con esas manos!'
music:
  group-radius: 8 # Distancia entre músicos vecinos de la misma sesión (2..16)
  audio-radius: 14 # Límite estricto por NPC, en bloques (12..15)
  visuals:
    enabled: true # instrumento y gestos cosméticos solo durante el trabajo musical
    head-movement: true # movimiento suave al ritmo; respeta golpes y otras actividades
    note-particles: true # notas ascendentes enviadas solo a la audiencia cercana

